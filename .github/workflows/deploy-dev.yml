# =============================================================================
# Deploy Dev — Caller Workflow
# =============================================================================
# Auto-deploys to dev on push to main branch when infra files change.
# Calls the reusable infra-deploy.yml workflow.
# =============================================================================

name: Deploy Dev

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'

jobs:
  deploy:
    uses: ./.github/workflows/infra-deploy.yml
    with:
      environment: dev
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      azure-resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
      parameter-file: infra/parameters.dev.bicepparam
    secrets: inherit
